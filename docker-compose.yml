name: chiku

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: chiku
      POSTGRES_PASSWORD: chiku
      POSTGRES_DB: chiku
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chiku"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://chiku:chiku@postgres:5432/chiku
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: development
      # Redis and a worker exist in this stack, so analysis is queued rather
      # than run inline — which is also why the API image needs no torch.
      ASYNC_JOBS: "true"
    command: >
      sh -c "alembic upgrade head &&
             uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
      - ./ml:/app/ml
      # Uploads are written here and read by the worker: one shared store.
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://chiku:chiku@postgres:5432/chiku
      REDIS_URL: redis://redis:6379/0
      INFERENCE_BACKEND: torch
      MODEL_CHECKPOINT: /app/experiments/outputs/resnet18-best.pt
      OPERATING_POINT_PATH: /app/experiments/outputs/xray-eval.json
    command: celery -A backend.workers.celery_app worker --loglevel=info
    volumes:
      - ./backend:/app/backend
      - ./ml:/app/ml
      # Checkpoint and evaluation artifact are DVC-tracked, not baked into the
      # image: `dvc pull` on the host and the worker sees the new weights.
      - ./experiments:/app/experiments:ro
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    environment:
      API_INTERNAL_URL: http://backend:8000
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend

volumes:
  pgdata:

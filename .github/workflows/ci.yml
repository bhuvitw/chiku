name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Ruff alone, so linting the whole tree costs seconds and does not wait on
      # a torch install. Config lives in pyproject.toml.
      - run: pip install ruff
      - run: ruff check backend ml scripts
      - run: ruff format --check backend ml scripts

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: chiku
          POSTGRES_PASSWORD: chiku
          POSTGRES_DB: chiku
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chiku"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Tests run against Postgres, never SQLite: the schema uses enum types and
      # UUIDs whose behaviour differs enough that SQLite would not prove it works.
      DATABASE_URL: postgresql+psycopg://chiku:chiku@localhost:5432/chiku
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r backend/requirements-dev.txt
      # Explicit path, not the pyproject testpaths: this job installs no torch,
      # so collecting ml/tests here would fail on import.
      - run: pytest backend/tests

  ml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # CPU wheels first, or pip pulls the CUDA build and its several GB of
      # nvidia-* dependencies onto a runner that has no GPU.
      - run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r ml/requirements-dev.txt
      - run: pytest ml/tests

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
